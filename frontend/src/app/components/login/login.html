<div class="min-h-screen bg-[#F5F2EE] flex items-center justify-center px-4 py-10"
     style="font-family: 'DM Sans', sans-serif;">

  <div class="w-full max-w-[400px]">

    <!-- Card -->
    <div class="bg-white border border-[#E0DDD8] rounded-2xl overflow-hidden">

      <!-- Top section -->
      <div class="px-8 pt-8 pb-6 border-b border-[#E0DDD8]">

        <!-- Brand -->
        <div class="flex items-center gap-2.5 mb-6">
          <div class="w-8 h-8 bg-[#1A1A1A] rounded-lg flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </div>
          <span class="text-[#1A1A1A] text-lg" style="font-family: 'DM Serif Display', serif;">Portal</span>
        </div>

        <h1 class="text-[#1A1A1A] text-[28px] leading-tight mb-1"
            style="font-family: 'DM Serif Display', serif;">
          Welcome back.
        </h1>
        <p class="text-[13px] text-[#888]">Sign in to continue to your workspace.</p>
      </div>

      <!-- Body -->
      <div class="px-8 pt-6 pb-8">

        <!-- Quick Presets -->
        <p class="text-[11px] uppercase tracking-[0.08em] text-[#999] font-medium mb-2">Quick fill</p>
        <div class="grid grid-cols-2 gap-2 mb-5">
          <button
            (click)="fillCredentials('General User')"
            type="button"
            class="flex items-center gap-1.5 px-3 py-2 bg-[#F5F2EE] border border-[#E0DDD8] rounded-lg text-[12px] text-[#444] font-medium hover:bg-[#EDE9E3] transition-colors duration-150">
            <span class="w-1.5 h-1.5 rounded-full bg-[#3D9970] flex-shrink-0"></span>
            User preset
          </button>
          <button
            (click)="fillCredentials('Admin')"
            type="button"
            class="flex items-center gap-1.5 px-3 py-2 bg-[#F5F2EE] border border-[#E0DDD8] rounded-lg text-[12px] text-[#444] font-medium hover:bg-[#EDE9E3] transition-colors duration-150">
            <span class="w-1.5 h-1.5 rounded-full bg-[#1A1A1A] flex-shrink-0"></span>
            Admin preset
          </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-3 mb-5">
          <div class="flex-1 h-px bg-[#E0DDD8]"></div>
          <span class="text-[11px] text-[#BBB] uppercase tracking-[0.08em] whitespace-nowrap">or manual</span>
          <div class="flex-1 h-px bg-[#E0DDD8]"></div>
        </div>

        <!-- Error Alert -->
        @if (errorMessage()) {
          <div class="mb-4 px-4 py-3 bg-red-50 border border-red-100 rounded-lg flex items-start gap-2.5">
            <svg class="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            <span class="text-[13px] text-red-600">{{ errorMessage() }}</span>
          </div>
        }

        <!-- Form -->
        <form (submit)="onSubmit()" class="space-y-4">

          <!-- User ID -->
          <div>
            <label for="username" class="block text-[12px] text-[#666] font-medium mb-1.5 tracking-[0.02em]">
              User ID
            </label>
            <input
              id="username"
              name="username"
              type="text"
              [(ngModel)]="username"
              required
              placeholder="e.g. user1 or admin"
              class="w-full px-3 py-2.5 bg-[#F9F8F6] border border-[#E0DDD8] rounded-lg text-[14px] text-[#1A1A1A] placeholder-[#C0BDB8] focus:outline-none focus:border-[#1A1A1A] focus:bg-white transition-colors duration-150"/>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-[12px] text-[#666] font-medium mb-1.5 tracking-[0.02em]">
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              [(ngModel)]="password"
              required
              placeholder="••••••••"
              class="w-full px-3 py-2.5 bg-[#F9F8F6] border border-[#E0DDD8] rounded-lg text-[14px] text-[#1A1A1A] placeholder-[#C0BDB8] focus:outline-none focus:border-[#1A1A1A] focus:bg-white transition-colors duration-150"/>
          </div>

          <!-- Role -->
          <div>
            <label for="role" class="block text-[12px] text-[#666] font-medium mb-1.5 tracking-[0.02em]">
              Login role
            </label>
            <div class="relative">
              <select
                id="role"
                name="role"
                [(ngModel)]="role"
                class="w-full px-3 py-2.5 bg-[#F9F8F6] border border-[#E0DDD8] rounded-lg text-[14px] text-[#1A1A1A] appearance-none focus:outline-none focus:border-[#1A1A1A] focus:bg-white transition-colors duration-150 cursor-pointer pr-9">
                <option value="General User">General User</option>
                <option value="Admin">Admin</option>
              </select>
              <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-[#999] pointer-events-none"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            [disabled]="isLoading()"
            class="w-full mt-2 py-3 px-4 bg-[#1A1A1A] hover:bg-[#2D2D2D] text-white text-[14px] font-medium rounded-lg transition-colors duration-150 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            @if (isLoading()) {
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
              Processing...
            } @else {
              Sign in
            }
          </button>

        </form>

        <p class="text-center text-[11px] text-[#BBB] mt-5">Single Page Application Gateway</p>
      </div>

    </div>
  </div>
</div>
